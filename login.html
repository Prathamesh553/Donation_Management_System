<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<div class="bg-img">
</div>
<meta charset="utf-8">
<title>Transparent Login Form UI</title>
<link rel="stylesheet" href="style.css">
<script src="https://kit.fontawesome.com/a076d85399.js"></script>
</head>
<body>
<div class="bg-img">
<div class="content">
<header>Admin Login</header>
<form action="authontication.php" method="POST">
<div class="field">
<span class="fa fa-user"></span>

<input type="text" name="adminUserName" required placeholder="Email">
</div>
<div class="field space">
<span class="fa fa-lock"></span>
<input type="password" name="adminPassword" class="password" required placeholder="password">

</div>
<br>
<div class="pass">
  <a href="#">Forgot Password</a>
</div>
<br>
<div class="btn">
<input type="submit" value="Login">
</div>
</form>
</div>
</div>
<script>

const pass_field= document.querySelector('.password') 
const show_btn = document.querySelector('.show');
 show_btn.addEventListener('click', function(){ 
if(pass_field.type === "password"){ 
pass_field.type = "text"; 
show_btn.style.color="#3498db";
show_btn.textContent = "HIDE";
}else{
pass_field.type = "password";
show_btn.style.color="#222";
show_btn.textContent = "SHOW";
}
});
</body>
</html>
