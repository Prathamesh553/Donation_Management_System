<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <form action="fund.php" method="POST">

        <div class="row">

            <div class="col">

                <h3 class="title">Payment</h3>

                <div class="inputBox">
                    <span>full name :</span>
                    <input type="text" name="nm" required>
                </div>
                <div class="inputBox">
                    <span>email :</span>
                    <input type="email" name="em" required>
                </div>
                <div class="inputBox">
                    <span>address :</span>
                    <input type="text" placeholder="room - street - locality" name="addr" required>
                </div>
                <div class="inputBox">
                    <span>city :</span>
                    <input type="text" placeholder="mumbai" name="city"required>
                </div>

                <div class="flex">
                    <div class="inputBox">
                        <span>state :</span>
                        <input type="text" name="state" required>
                    </div>
                    <div class="inputBox">
                        <span>zip code :</span>
                        <input type="text" name="zip" required>
                    </div>
                </div>

            </div>

            <div class="col">

                <h3 class="title">.</h3>

                <div class="inputBox">
                    <span>cards accepted :</span>
                    <img src="images/card_img.png" alt="">
                </div>
                <div class="inputBox">
                    <span>name on card :</span>
                    <input type="text" name="cname">
                </div>
                <div class="inputBox">
                    <span>Amount :</span>
                    <input type="number" name="cnum">
                </div>
                <div class="inputBox">
                    <span>Credit Card Number :</span>
                    <input type="text" name="emonth">
                </div>

                <div class="flex">
                    <div class="inputBox">
                        <span>exp year :</span>
                        <input type="number" name="year">
                    </div>
                    <div class="inputBox">
                        <span>CVV :</span>
                        <input type="text" name="cvv">
                    </div>
                </div>

            </div>
    
        </div>
        <input type="Submit" value="Justpayit" class="submit-btn">
        
</body>
</html>
